policy_version: 2
policy_name: daily-signal-gpt-pipeline
canonical_timezone: Asia/Tokyo

execution:
  fail_closed: true
  never_use_previous_day_as_fallback: true
  scout_max_age_hours_at_curator: 3
  curated_max_age_hours_at_writer: 2
  same_day_only: true
  stage_metadata_location: research_plan.execution
  required_execution_fields:
    - stage
    - policy_version
    - local_date
    - started_at
    - completed_at
    - status
    - planned_query_count
    - executed_query_count
  valid_execution_statuses: [complete, partial]
  partial_policy: >-
    partial is allowed only when warnings explain the limitation and all mandatory
    coverage entries are present. A downstream stage may downgrade or block it.

scout_contract:
  schema: daily-signal-scout/v2
  allowed_top_level_fields:
    - schema
    - generated_at
    - items
    - searched_queries
    - warnings
    - checked_sources
    - research_plan
  required_top_level_fields:
    - schema
    - generated_at
    - items
    - searched_queries
    - warnings
    - checked_sources
    - research_plan
  allowed_item_fields:
    - title
    - headline
    - url
    - link
    - source
    - source_kind
    - category
    - published_at
    - published
    - date
    - excerpt
    - summary
    - description
    - doi
    - authors
    - query
    - tags
    - topics
    - organization
    - company
    - document_type
    - type
    - language
    - score
    - author
  required_item_fields: [title, url, source, source_kind, category]
  allowed_source_kinds:
    - press_release
    - technical_report
    - paper
    - standard
    - official
    - news
    - journal
    - conference
    - corporate_tech
  source_kind_mapping:
    preprint: paper
    white_paper: technical_report
    survey: technical_report
    market_report: technical_report
    product_release: press_release
    github_repository: official
    company_blog: corporate_tech
  excerpt_max_chars: 400
  max_items: 80
  max_recorded_queries: 20
  no_full_text: true
  published_at_format: ISO-8601-or-YYYY-MM-DD
  checked_sources_rules:
    found_requires: query
    no_new_finding_requires: warning
    unreachable_requires: warning
    names_must_match_active_sources: true

company_scout:
  state_path: gpt_handoff/state/company-watch.json
  mandatory_watch_count: 7
  spillover:
    enabled: true
    max_additional_watch_sources: 5
    trigger_when_verified_items_below: 5
    selection: continue_from_rotation_cursor
  discovery_max: 5
  lookback_days: 30
  rotation:
    use_explicit_state_first: true
    derive_from_recent_files_only_if_state_missing_or_invalid: true
    update_state_only_after_dated_handoff_commit_succeeds: true
    advance_for_all_checked_sources: true
  state_required_fields:
    - schema
    - policy_version
    - updated_at
    - watchlist_hash
    - next_index
    - last_checked
    - last_run
    - warnings
  evidence_priority:
    - official
    - technical_report
    - paper
    - reputable_industry_news
  old_or_undated_evergreen_pages_do_not_count_as_new: true

research_scout:
  lookback_days: 30
  max_items: 80
  max_items_per_domain: 8
  preserve_noise: true
  query_lanes:
    engineering_ai:
      target_queries: 4
      themes: [AI-assisted design, CAD, CAE, CFD, FEA, PLM, MBSE, optimization, surrogate, neural operator]
    agents_enterprise:
      target_queries: 3
      themes: [AI agents, coding, workflow automation, enterprise AI, RAG, data infrastructure]
    models_open_weights:
      target_queries: 3
      themes: [frontier models, open weights, OSS, inference efficiency, licensing]
    reports_surveys:
      target_queries: 3
      themes: [AI adoption, ROI, productivity, workforce, spending, industrial AI, manufacturing AI]
    scientific_wildcards:
      target_queries: 3
      themes: [materials, chemistry, robotics, digital twin, HPC, EDA, research automation, edge AI]
    non_us_rotation:
      target_queries: 2
      themes: [Japan, China, Europe, Korea, India]
  target_mix:
    core_percent: [50, 65]
    report_percent: [10, 20]
    wildcard_percent: [25, 40]
  target_mix_is_soft_not_a_filler_quota: true
  record_zero_result_queries: true

curator:
  input_schemas: [daily-signal-scout/v2]
  output_schema: daily-signal-curated/v1
  publication_history:
    receipt_glob: gpt_handoff/published/*.json
    index_path: gpt_handoff/state/published-index.json
    exact_url_dedupe_days: 90
    semantic_event_dedupe_days: 30
    allow_repeat_only_for_material_delta: true
  evidence_rules:
    primary_source_required_for_selected: true
    vendor_performance_claim_must_be_labeled_self_reported: true
    independently_corroborate_contested_or_high_impact_claims_when_available: true
    every_selected_claim_must_have_source_url: true
    unverified_material_claims_must_be_removed_or_downgraded: true
  scoring:
    scale: [0, 5]
    dimensions:
      novelty: 0.15
      source_quality: 0.10
      evidence_strength: 0.15
      engineering_relevance: 0.20
      enterprise_relevance: 0.10
      strategic_significance: 0.15
      reader_value: 0.15
    interpretation:
      5: exceptional
      4: strong
      3: useful
      2: weak
      1: poor
      0: disqualifying
  selection:
    selected_target: [8, 12]
    lead_target: [2, 3]
    wildcards_target: [1, 3]
    backlog_target: [8, 20]
    do_not_fill_weak_slots: true
    max_selected_from_same_organization: 2
    max_selected_about_general_model_releases: 3
    preserve_high_quality_report_when_available: true
  required_top_level_fields:
    - schema
    - generated_at
    - source_files
    - status
    - summary
    - editorial_plan
    - coverage_audit
    - selected
    - wildcards
    - backlog
    - rejected
    - warnings
  coverage_audit_fields:
    - input_item_count
    - deduplicated_item_count
    - source_domain_count
    - organization_count
    - regions_observed
    - lanes
    - known_gaps
  required_selected_fields:
    - id
    - event_key
    - tier
    - title
    - primary_url
    - supporting_urls
    - published_at
    - organization
    - category
    - source_kind
    - factual_points
    - claims
    - why_it_matters
    - practical_implication
    - tags
    - scores
    - weighted_score
    - confidence
    - provenance
  valid_tiers: [lead, standard, report]
  claim_fields:
    - text
    - source_url
    - verification_status
    - attribution_type
    - evidence_location
  valid_verification_statuses: [verified, partially_verified, unverified]
  valid_attribution_types: [official_fact, official_claim, self_reported_benchmark, independent_analysis, survey_result, inference]
  editorial_plan_fields:
    - lead_ids
    - ordered_ids
    - central_signals
    - tensions_or_caveats
    - desired_depth
  report_details_fields:
    - publisher
    - published_at
    - sample_size
    - methodology
    - geographies
    - key_metrics
    - comparison_to_previous
    - practical_meaning
    - caveats

writer:
  source_repository: naoyamd/daily-signal-collector
  destination_repository: naoyamd/daily-signal
  input_schema: daily-signal-curated/v1
  article_path: content/daily/YYYY-MM-DD-daily-signal.md
  broad_discovery_forbidden: true
  use_only_verified_or_partially_verified_claims: true
  preserve_curator_order: true
  preserve_selected_count_unless_verification_fails: true
  depth_budget_japanese_characters:
    overview: [350, 700]
    lead_item: [500, 900]
    standard_item: [280, 520]
    report_item: [700, 1300]
    wildcard_item: [220, 420]
  model_front_matter:
    exact_runtime_identifier_available: use_exact_identifier
    otherwise: ChatGPT Scheduled Task
    never_hardcode_unverified_model_name: true
  preflight_checks:
    - same_day_curated_status_ready
    - source_urls_public_https
    - every_material_claim_has_evidence
    - source_count_matches_body
    - no_internal_stage_names_in_public_copy
    - no_first_person_editorial_voice
    - no_existing_same_day_article
    - no_empty_or_invented_dates
    - report_methodology_and_caveats_preserved
    - retention_metrics_calculated
  required_quality_metrics:
    - curated_selected_count
    - published_selected_count
    - curated_wildcard_count
    - published_wildcard_count
    - curated_claim_count
    - published_claim_count
    - dropped_item_ids
    - dropped_claim_count
    - verification_failure_count
    - report_metric_count
    - published_report_metric_count
    - article_character_count
  quality_warning_thresholds:
    selected_retention_ratio_min: 0.80
    wildcard_retention_ratio_min: 0.67
    claim_retention_ratio_min: 0.75
    report_metric_retention_ratio_min: 0.80
  publication_receipt_path: gpt_handoff/published/YYYY-MM-DD.json
  publication_index_path: gpt_handoff/state/published-index.json
  receipt_only_after_article_commit: true

publication_receipt:
  schema: daily-signal-published/v1
  required_fields:
    - schema
    - published_at
    - article_repository
    - article_path
    - article_commit
    - curated_source
    - published_item_ids
    - event_keys
    - primary_urls
    - organizations
    - tags
    - title
    - quality_metrics

publication_index:
  schema: daily-signal-published-index/v1
  retention_days: 180
  required_entry_fields:
    - event_keys
    - published_item_ids
    - primary_urls
    - article_repository
    - article_path
    - article_commit
    - published_at
    - title
    - organizations
    - tags

evaluation:
  purpose: measure_where_information_is_lost_instead_of_judging_by_style
  daily_signals:
    - scout_item_count_by_lane
    - company_found_no_new_unreachable
    - cross_scout_duplicate_rate
    - curator_selection_rate
    - selected_source_domain_diversity
    - writer_selected_retention_ratio
    - writer_claim_retention_ratio
    - report_metric_retention_ratio
    - writer_verification_failure_count
    - blocked_stage_and_reason
  interpretation:
    high_cross_scout_duplicate_rate: reduce_overlap_or_improve_role_boundaries
    low_curator_selection_rate: scout_noise_too_high_or_topics_too_broad
    low_claim_retention_ratio: writer_is_overcompressing_or_curator_claims_are_weak
    high_verification_failure_count: scout_or_curator_source_validation_is_insufficient
    repeated_blocked_runs: schedule_gap_or_connector_reliability_is_insufficient
